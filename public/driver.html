<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RideBook Driver</title>
<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>
    <link rel="stylesheet" href="style.css">
</head>

<body class="drv-body">

<div class="drv-app">

    <div id="map" class="drv-map"></div>

    <div class="drv-map-offline-overlay" id="map-offline-overlay">
        <div class="drv-offline-icon">⏻</div>
        <strong>You're offline</strong>
        <span>Go online to receive trip requests</span>
        <button class="drv-btn-primary drv-go-online-btn">Go online</button>
    </div>

    <header class="drv-topbar">

        <div class="drv-profile">
            <div class="drv-avatar" id="driver-avatar">?</div>
            <div class="drv-profile-info">
                <strong id="driver-name">Loading...</strong>
                <small id="driver-meta"></small>
            </div>
        </div>

        <div class="drv-topbar-right">

            <div class="drv-earnings-pill">
                <strong id="earnings-today">R0.00</strong>
                <small>today</small>
            </div>

            <label class="drv-toggle">
                <input type="checkbox" id="online-toggle">
                <span class="drv-toggle-track">
                    <span class="drv-toggle-thumb"></span>
                </span>
                <span class="drv-toggle-label" id="online-label">Offline</span>
            </label>

            <button id="driver-logout-btn" class="drv-icon-btn" title="Logout">⏻</button>

        </div>

    </header>

    <div class="drv-location-chip">
        <span class="drv-location-dot"></span>
        <span id="driver-location-label">Locating you…</span>
    </div>

    <section class="drv-sheet">

        <div class="drv-sheet-handle"></div>

        <div class="drv-sheet-header">
            <div class="drv-sheet-title-row">
                <h2 id="sheet-title">Offline</h2>
                <span class="drv-count-badge" id="available-count" hidden>0</span>
            </div>
            <div class="drv-rate-badge" id="rate-badge">R15.00 base + R8.50/km</div>
        </div>

        <div class="drv-sheet-body" id="sheet-body">
            <p class="drv-empty">Loading…</p>
        </div>

        <button class="drv-history-row" id="open-history-btn">
            <span class="drv-history-icon">🕓</span>
            <span class="drv-history-text">
                <strong>Ride history</strong>
                <small id="history-summary">View your completed trips</small>
            </span>
            <span class="drv-chevron">›</span>
        </button>

    </section>

    <div class="drv-history-overlay" id="history-overlay" hidden>

        <div class="drv-history-panel">

            <div class="drv-history-panel-header">
                <div>
                    <h2>Ride history</h2>
                    <p id="history-panel-subtitle">0 trips · 0.0 km driven</p>
                </div>
                <button class="drv-close-btn" id="close-history-btn">✕</button>
            </div>

            <div class="drv-history-stats">
                <div class="drv-stat-box">
                    <span>EARNED TODAY</span>
                    <strong id="stat-earned-today">R0.00</strong>
                </div>
                <div class="drv-stat-box">
                    <span>TRIPS TODAY</span>
                    <strong id="stat-trips-today">0</strong>
                </div>
            </div>

            <div class="drv-history-list" id="history-list">
                <p class="drv-empty">Loading…</p>
            </div>

        </div>

    </div>

    <div class="drv-toast" id="drv-toast" hidden></div>

</div>

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin="">
</script>

<script src="driver.js"></script>

</body>

</html>
