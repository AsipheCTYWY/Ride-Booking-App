<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RideBook Driver</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="driver-body">

<header class="driver-header">

    <div>
        <h1>RideBook Driver</h1>
        <p>Manage your rides</p>
    </div>

    <button id="driver-logout-btn" class="logout-btn">
        Logout
    </button>

</header>

<main class="driver-container">

    <section>

        <h2>Available Rides</h2>

        <div id="available-rides"></div>

    </section>

    <section>

        <h2>My Active Rides</h2>

        <div id="my-rides"></div>

    </section>

    <section>

        <h2>Completed Rides</h2>

        <div id="completed-rides"></div>

    </section>

</main>

<script src="driver.js"></script>

</body>
</html>
