<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RideBook - Request a Ride</title>
<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>
    <link rel="stylesheet" href="style.css">
</head>

<body class="passenger-body">

<div class="passenger-page">

    <div class="passenger-layout">

        <!-- =====================================
             LEFT BOOKING PANEL
        ====================================== -->

        <aside class="booking-panel">

            <!-- HEADER -->

            <div class="brand-row">

                <div>
                    <h1>RideBook</h1>

                    <p>Your journey, simplified.</p>
                </div>

                <button
                    id="index-logout-btn"
                    class="logout-btn">
                    Logout
                </button>

            </div>


            <!-- USER PROFILE -->

            <div class="passenger-profile">

                <div class="profile-avatar" id="profile-avatar">?</div>

                <div class="profile-info">
                    <strong id="profile-name">Loading...</strong>
                    <small id="profile-email"></small>
                </div>

            </div>


            <!-- LOCATION -->

            <div class="location-label">

                <span class="location-dot"></span>

                Gqeberha, Eastern Cape

            </div>


            <!-- HERO -->

            <h2 class="hero-title">
                Go anywhere with RideBook
            </h2>


            <!-- =====================================
                 BOOKING CARD
            ====================================== -->

            <div class="booking-card">

                <h3>Plan your ride</h3>


                <!-- PICKUP -->

                <div class="search-box">

                    <span class="search-icon pickup-icon">
                        ●
                    </span>

                    <input
                        type="text"
                        id="pickup-search"
                        placeholder="Pickup location"
                        autocomplete="off"
                    >

                </div>


                <div class="search-divider"></div>


                <!-- DROPOFF -->

                <div class="search-box">

                    <span class="search-icon dropoff-icon">
                        ■
                    </span>

                    <input
                        type="text"
                        id="dropoff-search"
                        placeholder="Drop-off location"
                        autocomplete="off"
                    >

                </div>


                <!-- SEARCH RESULTS -->

                <div id="search-results"></div>


                <!-- PRICE DETAILS -->

                <div id="price-details" class="price-details hidden">
                    <span>Estimated Fare</span>
                    <strong id="price-amount">--</strong>
                </div>


                <!-- BUTTONS -->

                <div class="action-row">

                    <button
                        id="request-btn"
                        disabled>
                        Request Ride
                    </button>

                    <button
                        id="reset-btn"
                        class="secondary-btn">
                        Reset
                    </button>

                </div>

            </div>


            <!-- =====================================
                 ACTIVE RIDE
            ====================================== -->

            <section class="passenger-section">

                <h3>Active Ride</h3>

                <div id="active-ride">

                    <p class="no-rides">
                        No active ride.
                    </p>

                </div>

            </section>


            <!-- =====================================
                 RIDE HISTORY LINK
            ====================================== -->

            <a href="history.html" class="secondary-btn view-history-btn">
                View Ride History
            </a>

        </aside>


        <!-- =====================================
             MAP
        ====================================== -->

        <main class="map-panel">

            <div class="map-heading">

                <span>📍</span>

                <span>Plan your route</span>

            </div>

            <div id="map"></div>

        </main>

    </div>

</div>


<!-- LEAFLET -->

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin="">
</script>


<!-- YOUR JAVASCRIPT -->

<script src="app.js"></script>

</body>

</html>
